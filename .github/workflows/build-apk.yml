name: Build Android APK

# 手动触发：仓库页面 Actions -> Build Android APK -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unzip source
        run: |
          mkdir -p app
          unzip -q chat-demo-src.zip -d app
          echo "--- source root ---"
          ls -a app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install web dependencies
        working-directory: app
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: app
        run: pnpm build

      - name: Add Capacitor Android shell
        working-directory: app
        run: |
          pnpm add -D @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/deepseek-chat.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-chat-apk
          path: out/deepseek-chat.apk
          if-no-files-found: error
          retention-days: 30
