name: Build Android APK

# 两种模式：
#   make-key = 首次生成固定签名（只运行一次，然后把产物存进 Secret）
#   build    = 正常打包
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = 打安装包；make-key = 首次生成固定签名（只做一次）'
        type: choice
        options:
          - build
          - make-key
        default: build

permissions:
  contents: read

jobs:
  make-key:
    name: Generate signing key
    if: inputs.mode == 'make-key'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore and secret blob
        run: |
          set -euo pipefail
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS="$STORE_PASS"
          ALIAS=deepseek-release
          keytool -genkeypair -keystore release.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=DeepSeek Chat, OU=Personal, O=Personal, L=Beijing, ST=Beijing, C=CN"
          jq -n --arg ks "$(base64 -w0 release.keystore)" \
                --arg sp "$STORE_PASS" \
                --arg kp "$KEY_PASS" \
                --arg al "$ALIAS" \
            '{keystoreBase64: $ks, storePassword: $sp, keyAlias: $al, keyPassword: $kp}' > signing.json
          base64 -w0 signing.json > SIGNING_SECRET.txt
          echo "SIGNING_SECRET.txt 大小：$(wc -c < SIGNING_SECRET.txt) 字节"

      - name: Upload signing secret
        uses: actions/upload-artifact@v7
        with:
          name: android-signing-key
          path: SIGNING_SECRET.txt
          retention-days: 7

  build:
    name: Build APK
    if: inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIGNING_SECRET: ${{ secrets.ANDROID_SIGNING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unzip source
        run: |
          mkdir -p app
          unzip -q chat-demo-src.zip -d app
          echo "--- source root ---"
          ls -a app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install web dependencies
        working-directory: app
        run: pnpm install --no-frozen-lockfile

      - name: Add Capacitor packages
        working-directory: app
        run: |
          pnpm add -D @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8 \
            @capacitor/filesystem@8 @capacitor/share@8

      - name: Type check
        working-directory: app
        run: pnpm type

      - name: Build web app
        working-directory: app
        run: pnpm build

      - name: Add Capacitor Android shell
        working-directory: app
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Bump version
        working-directory: app
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          NAME="1.0.${{ github.run_number }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${NAME}\"/" android/app/build.gradle
          grep -nE "versionCode |versionName " android/app/build.gradle

      - name: Build APK
        working-directory: app/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -n "${SIGNING_SECRET}" ]; then
            echo "== 使用固定签名（release） =="
            echo "${SIGNING_SECRET}" | base64 -d > ../signing.json
            mkdir -p app
            jq -r .keystoreBase64 ../signing.json | base64 -d > app/release.keystore
            export KS_FILE="$PWD/app/release.keystore"
            export KS_STORE_PASSWORD="$(jq -r .storePassword ../signing.json)"
            export KS_KEY_ALIAS="$(jq -r .keyAlias ../signing.json)"
            cat > app/signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_STORE_PASSWORD")
                      keyAlias System.getenv("KS_KEY_ALIAS")
                      keyPassword System.getenv("KS_STORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          GRADLE
            echo "apply from: 'signing.gradle'" >> app/build.gradle
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "::warning::未配置 ANDROID_SIGNING，本次为调试签名，后续版本无法覆盖安装"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find app/android/app/build/outputs/apk -name '*.apk' -print -quit)
          echo "found: ${APK}"
          cp "${APK}" out/deepseek-chat.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-chat-apk
          path: out/deepseek-chat.apk
          if-no-files-found: error
          retention-days: 30
